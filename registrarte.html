<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - R.A.V</title>

    <link rel="stylesheet" href="registrarte.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="contenedor">

        <form class="formulario">

            <div class="fila">
                <div class="campo">
                    <label for="nombre">Nombre(s)*</label>
                    <input type="text" id="nombre" placeholder="Ingrese su(s) nombre(s)">
                </div>

                <div class="campo">
                    <label for="apellido">Apellido(s)*</label>
                    <input type="text" id="apellido" placeholder="Ingrese su(s) apellido(s)">
                </div>
            </div>

            <div class="campo">
                <label for="email">Correo Electrónico*</label>
                <input type="email" id="email" placeholder="Ingrese su email">
            </div>

            <div class="campo">
                <label for="pass">Contraseña*</label>
                <input type="password" id="pass" placeholder="Ingrese su contraseña">
            </div>

            <div class="campo">
                <label for="pass2">Confirmar contraseña*</label>
                <input type="password" id="pass2" placeholder="Confirme la contraseña">
            </div>

            <div class="fila">
                <div class="campo pequeño">
                    <label for="nacimiento">Fecha de nacimiento*</label>
                    <input type="date" id="nacimiento" placeholder="yyyy/mm/dd">
                </div>

                <div class="campo">
                    <label for="calle">Calle*</label>
                    <input type="text" id="calle" placeholder="calle">
                </div>
            </div>

            <div class="fila">
                <div class="campo pequeño">
                    <label for="telefono">Teléfono*</label>
                    <input type="text" id="telefono" placeholder="telefono">
                </div>

                <div class="campo pequeño">
                    <label for="numero">Número*</label>
                    <input type="text" id="numero" placeholder="numero">
                </div>

                <div class="campo pequeño">
                    <label for="piso">Piso</label>
                    <input type="text" id="piso" placeholder="piso">
                </div>
            </div>

        </form>

        <div class="lado-derecho">
            <div class="logo">
                <img src="Logo.png" alt="Logo R.A.V">
            </div>

            <button class="btn"><a href="feed.html">Registrarse</a></button>
        </div>
    </div>
</body>
</html>
